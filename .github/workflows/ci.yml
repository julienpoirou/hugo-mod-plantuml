name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.159.0"
          extended: true

      - name: Build sample site
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="${RUNNER_TEMP}/site"
          OUT_DIR="${RUNNER_TEMP}/public"
          mkdir -p "${SITE_DIR}/content" "${SITE_DIR}/assets/renderers" "${SITE_DIR}/static" "${SITE_DIR}/layouts/_default" "${SITE_DIR}/_modules"
          ln -s "${GITHUB_WORKSPACE}" "${SITE_DIR}/_modules/hugo-mod-plantuml"

          cat > "${SITE_DIR}/layouts/_default/single.html" <<'EOF'
          <!DOCTYPE html>
          <html><body>{{ .Content }}</body></html>
          EOF

          cat > "${SITE_DIR}/layouts/_default/list.html" <<'EOF'
          <!DOCTYPE html>
          <html><body>{{ .Content }}</body></html>
          EOF

          cat > "${SITE_DIR}/hugo.toml" <<'EOF'
          baseURL = "https://example.org/"
          [module]
            [[module.mounts]]
              source = "content"
              target = "content"
            [[module.mounts]]
              source = "assets"
              target = "assets"
            [[module.mounts]]
              source = "static"
              target = "static"
            [[module.mounts]]
              source = "layouts"
              target = "layouts"
            [[module.mounts]]
              source = "_modules/hugo-mod-plantuml/layouts"
              target = "layouts"
            [[module.mounts]]
              source = "_modules/hugo-mod-plantuml/assets"
              target = "assets"
          EOF

          cat > "${SITE_DIR}/assets/renderers/plantuml.puml" <<'EOF'
          @startuml
          Alice -> Bob : Hello
          return ok
          @enduml
          EOF

          B64_SOURCE=$(printf '@startuml\nX -> Y\n@enduml' | base64 -w0)

          cat > "${SITE_DIR}/content/test.md" <<EOF
          ---
          title: "PlantUML test"
          ---

          {{< plantuml >}}
          @startuml
          "Début" -> "École n°1"
          @enduml
          {{< /plantuml >}}

          {{< plantuml src="renderers/plantuml.puml" />}}

          {{< puml b64="${B64_SOURCE}" dark="true" />}}
          EOF

          hugo --source "${SITE_DIR}" --destination "${OUT_DIR}"
          PAGE="${OUT_DIR}/test/index.html"

          # Assets are fingerprinted (cache-busting) and injected only once
          # for the whole page.
          grep -oE 'libs/hugo-mod-plantuml/hugo-mod-plantuml\.[0-9a-f]+\.js' "${PAGE}"
          test "$(grep -oE 'libs/hugo-mod-plantuml/hugo-mod-plantuml\.[0-9a-f]+\.js' "${PAGE}" | wc -l)" -eq 1

          # The four injected assets (viz-global, engine modulepreload, css,
          # glue) each ship a matching Subresource Integrity hash.
          test "$(grep -c 'integrity="sha256-' "${PAGE}")" -eq 4

          # The engine is preloaded as an ES module.
          grep -qE 'rel="modulepreload" href="[^"]*libs/hugo-mod-plantuml/plantuml\.[0-9a-f]+\.js"' "${PAGE}"

          # The fingerprinted files are actually published at their paths.
          JS_PATH=$(grep -oE 'libs/hugo-mod-plantuml/hugo-mod-plantuml\.[0-9a-f]+\.js' "${PAGE}" | head -1)
          test -f "${OUT_DIR}/${JS_PATH}"
          ENGINE_PATH=$(grep -oE 'libs/hugo-mod-plantuml/plantuml\.[0-9a-f]+\.js' "${PAGE}" | head -1)
          test -f "${OUT_DIR}/${ENGINE_PATH}"

          # All three input modes produce a wrapper.
          test "$(grep -c 'data-hugo-mod-plantuml' "${PAGE}")" -eq 3

          # The dark-mode wrapper carries the flag.
          test "$(grep -c 'data-dark="true"' "${PAGE}")" -eq 1

          # Inline UTF-8 source survives the base64 round-trip untouched.
          # Hugo may escape characters in attributes; browsers unescape them,
          # so undo the one escape our source can trigger before decoding.
          grep -o 'data-source="[^"]*"' "${PAGE}" | sed -n '1p' \
            | sed 's/data-source="//;s/"$//;s/&#43;/+/g' | base64 -d \
            | grep -q "École n°1"

          # An empty source must fail the build explicitly.
          cat > "${SITE_DIR}/content/invalid.md" <<'EOF'
          ---
          title: "invalid"
          ---

          {{< plantuml >}}
          {{< /plantuml >}}
          EOF
          if hugo --source "${SITE_DIR}" --destination "${RUNNER_TEMP}/public-invalid"; then
            echo "expected the build to fail on an empty shortcode source" >&2
            exit 1
          fi

          # Remove the intentionally-invalid page so it does not break the
          # full-site build the browser verification consumes.
          rm -f "${SITE_DIR}/content/invalid.md"
          hugo --source "${SITE_DIR}" --destination "${OUT_DIR}"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify real rendering in a headless browser
        run: node tests/verify-render.js "${RUNNER_TEMP}/public" "test/"
